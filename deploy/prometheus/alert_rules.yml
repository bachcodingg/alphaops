# Each alert links to its section in docs/runbook.md.
groups:
  - name: alphaops
    rules:
      - alert: AlphaopsJobFailed
        expr: alphaops_job_status_code == 2
        labels:
          severity: critical
        annotations:
          summary: "alphaops {{ $labels.pipeline }} failed"
          runbook: "docs/runbook.md#alphaopsjobfailed"

      - alert: AlphaopsJobDegraded
        expr: alphaops_job_status_code == 1
        labels:
          severity: warning
        annotations:
          summary: "alphaops {{ $labels.pipeline }} completed with partial failures"
          runbook: "docs/runbook.md#alphaopsjobdegraded"

      - alert: AlphaopsIngestStale
        # No successful ingest for 26h on a weekday: the job didn't run, or keeps failing.
        expr: >
          (time() - alphaops_job_last_success_timestamp_seconds{pipeline="ingest"}) > 26 * 3600
          and on() (day_of_week() >= 1 and day_of_week() <= 5)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "no successful ingest for {{ $value | humanizeDuration }}"
          runbook: "docs/runbook.md#alphaopsingeststale"

      - alert: AlphaopsMetricsMissing
        # The job didn't even push metrics: cron/systemd/host problem.
        expr: absent(alphaops_job_last_run_timestamp_seconds{pipeline="ingest"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "alphaops ingest has never reported metrics to the Pushgateway"
          runbook: "docs/runbook.md#alphaopsmetricsmissing"

      - alert: AlphaopsDataQualityErrors
        expr: sum by (check) (alphaops_dq_failed_rows{severity="error"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} rows failed '{{ $labels.check }}' and were quarantined"
          runbook: "docs/runbook.md#alphaopsdataqualityerrors"

      - alert: AlphaopsVendorIncident
        expr: alphaops_dq_failed_rows{check="systemic_date"} > 0
        labels:
          severity: critical
        annotations:
          summary: "many symbols failed checks on the same date: likely a vendor incident"
          runbook: "docs/runbook.md#alphaopsvendorincident"

      - alert: AlphaopsSymbolsFailing
        expr: alphaops_symbols_failed{pipeline="ingest"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} symbols could not be fetched"
          runbook: "docs/runbook.md#alphaopssymbolsfailing"
